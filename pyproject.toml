[project]
name = "dflash-voice"
version = "0.1.0"
description = "DFlash Voice: Accelerating RVQ audio token generation for TTS"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "loguru",
    "numpy",
    "tqdm",
    "datasets",
    "requests",
    "huggingface-hub",
    "typer",
]

[tool.setuptools.packages.find]
include = ["mlx_decode*", "dataprep*", "train*"]
exclude = ["mlx_decode.tests*", "dataprep.tests*", "train.tests*"]

[project.optional-dependencies]
mlx_decode = [
    "mlx>=0.31.1",
    "mlx-lm==0.31.1",
    "mlx-audio==0.4.4",
    "transformers==5.6.0",
    "huggingface-hub==1.5.0",
]

train = [
    "transformers==5.6.0",
    "torch>=2.2.0",
    "webdataset==1.0.2",
    "accelerate>=0.30.0",
    "numpy",
    "tqdm",
]

dev = [
    "pytest",
    "modal",
]

dataprep-miso = [
    "miso-tts @ git+https://github.com/akashmjn/MisoTTS.git@akash/main",
    "soundfile",
    "pytest",
]
# Chatterbox AR + Flash tokenize. chatterbox-tts pins transformers==5.2.0 and
# torch 2.6, so this is a third mutually-exclusive environment -- install it alone.
dataprep-chatterbox = [
    "chatterbox-tts==0.1.7",
    "soundfile",
    "librosa",
    "pytest",
]
dataprep-mlx = [
    "mlx>=0.31.1",
    "mlx-lm==0.31.1",
    "mlx-audio==0.4.4",
    "transformers==5.6.0",
    "huggingface-hub==1.5.0",
    "scipy",
    "soundfile",
    "torch",
    "pytest",
    "marimo",
    "altair",
]

[tool.pytest.ini_options]
addopts = "-m 'not expensive and not deprecated'"
markers = [
    "expensive: loads full models for dataprep featurization or entropy checks",
    "deprecated: covers the unmaintained MLX dataprep backends (qwen3 / fish); see dataprep/mlx_backends/README.md",
]
