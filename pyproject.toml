[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dflash-voice"
version = "0.1.0"
description = "DFlash Voice: Block Diffusion for Flash TTS Speculative Decoding"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "loguru",
    "numpy",
    "tqdm",
    "datasets",
    "requests",
    "huggingface-hub",
]

[tool.setuptools.packages.find]
include = ["tts_mlx*", "dataprep*"]
exclude = ["tts_mlx.tests*", "dataprep.tests*"]

[project.optional-dependencies]
tts_mlx = [
    "mlx>=0.31.1",
    "mlx-lm==0.31.1",
    "mlx-audio==0.4.4",
    "transformers==5.6.0",
    "huggingface-hub==1.5.0",
]

dev = [
    "pytest",
    "modal",
]

[dependency-groups]
dataprep = [
    "miso-tts @ git+https://github.com/akashmjn/MisoTTS.git@akash/main",
    "soundfile",
    "pytest",
]
dataprep-mlx = [
    "mlx>=0.31.1",
    "mlx-lm==0.31.1",
    "mlx-audio==0.4.4",
    "transformers==5.6.0",
    "huggingface-hub==1.5.0",
    "scipy",
    "soundfile",
    "torch",
    "pytest",
]

[tool.uv]
conflicts = [
    [
        { group = "dataprep" },
        { group = "dataprep-mlx" },
    ],
    [
        { group = "dataprep" },
        { extra = "tts_mlx" },
    ],
]

[tool.pytest.ini_options]
markers = [
    "integration: downloads models and runs end-to-end inference",
]
