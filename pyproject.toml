[project]
name = "dflash-voice"
version = "0.1.0"
description = "DFlash Voice: Accelerating RVQ audio token generation for TTS"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "loguru",
    "numpy",
    "tqdm",
    "datasets",
    "requests",
    "huggingface-hub",
]

[tool.setuptools.packages.find]
include = ["tts_mlx*", "dataprep*"]
exclude = ["tts_mlx.tests*", "dataprep.tests*"]

[project.optional-dependencies]
tts_mlx = [
    "mlx>=0.31.1",
    "mlx-lm==0.31.1",
    "mlx-audio==0.4.4",
    "transformers==5.6.0",
    "huggingface-hub==1.5.0",
]

dev = [
    "pytest",
    "modal",
]

dataprep = [
    "miso-tts @ git+https://github.com/akashmjn/MisoTTS.git@akash/main",
    "soundfile",
    "typer",
    "pytest",
]
dataprep-mlx = [
    "mlx>=0.31.1",
    "mlx-lm==0.31.1",
    "mlx-audio==0.4.4",
    "transformers==5.6.0",
    "huggingface-hub==1.5.0",
    "scipy",
    "soundfile",
    "torch",
    "typer",
    "pytest",
    "marimo",
    "altair",
]

[tool.pytest.ini_options]
addopts = "-m 'not expensive'"
markers = [
    "expensive: loads full models for dataprep featurization or entropy checks",
]
